:root {
  --primitive-color-blue-10: #020631;
  --primitive-color-blue-50: #4353ff;
  --primitive-color-bg-card: #ffffff;
  --primitive-color-bg-page: #f9f9fc;
  --primitive-color-neutral-100: #e5e7ef;
  --primitive-color-neutral-200: #c4cbdd;
  --primitive-color-neutral-300: #9ca5be;
  --primitive-color-neutral-400: #68769c;
  --primitive-color-neutral-600: #47506a;
  --primitive-color-semantic-bg-grey: #f5f5f5;
  --primitive-color-semantic-bg-blue: #e9f2ff;
  --primitive-color-semantic-bg-green: #dcfff1;
  --primitive-color-semantic-text-green: #008516;
  --primitive-color-semantic-text-blue: #0055d4;
  --primitive-gradient-app-tile: linear-gradient(180deg, #4353ff 0%, #8528f8 100%); /* "Illustration/app Tile" */

  --color-text-primary: var(--primitive-color-blue-10);
  --color-text-label: var(--primitive-color-neutral-600);
  --color-text-large-text: var(--primitive-color-neutral-400);
  --color-text-link: var(--primitive-color-semantic-text-blue);
  --color-surface-primary: var(--primitive-color-bg-page);
  --color-surface-secondary: var(--primitive-color-bg-card);
  --color-button-default: var(--primitive-color-blue-50);
  --font-family-body: "Poppins", sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-family-body); background: var(--color-surface-primary); color: var(--color-text-primary); }
button { font-family: inherit; }

.app { display: flex; min-height: 100vh; }

/* Side Navigation Panel (bg = color/primary/blue-10) */
.sidenav { width: 108px; flex-shrink: 0; background: var(--primitive-color-blue-10); padding: 32px 24px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: sticky; top: 0; height: 100vh; }
.sidenav-top { display: flex; flex-direction: column; align-items: center; gap: 48px; width: 100%; }
.logo-row { position: relative; width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; }
.logo { width: 60px; height: 49px; position: relative; color: #fff; font-weight: 700; font-size: 28px; display: flex; align-items: center; justify-content: center; }
.collapse-btn { position: absolute; left: 71.5px; top: 0; min-width: 44px; min-height: 44px; padding: 10px; background: var(--color-surface-secondary); border: 1px solid var(--primitive-color-blue-10); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--primitive-color-blue-10); z-index: 2; }
.nav-list { display: flex; flex-direction: column; gap: 16px; width: 54px; }
.nav-item { display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 8px; background: none; border: none; color: #fff; cursor: pointer; }

.main { flex: 1; min-width: 0; padding: 24px 40px 48px 24px; display: flex; flex-direction: column; gap: 24px; }

/* Shell bar */
.shell { display: flex; align-items: center; justify-content: flex-end; gap: 25px; min-height: 48px; }
.search-bar { display: flex; align-items: center; gap: 8px; height: 40px; width: 358px; max-width: 100%; padding: 8px 12px; background: var(--color-surface-secondary); border: 1px solid var(--primitive-color-neutral-400); border-radius: 10px; color: var(--color-text-label); }
.search-bar input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; line-height: 24px; color: var(--color-text-primary); }
.search-bar input::placeholder { color: var(--color-text-label); opacity: 1; }
.search-bar:focus-within { box-shadow: 0 0 0 2px var(--primitive-color-neutral-200); }
.lang { display: flex; align-items: center; gap: 8px; height: 40px; font-size: 16px; line-height: 24px; color: #000; }
.shell-right { display: flex; align-items: center; gap: 24px; }
.icon-plain { display: flex; background: none; border: none; color: var(--color-text-primary); padding: 0; cursor: pointer; }
.profile { width: 48px; height: 48px; border-radius: 24px; background: var(--color-button-default); border: 1px solid var(--primitive-color-neutral-300); overflow: hidden; position: relative; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.profile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* Title row */
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title-left { display: flex; align-items: center; gap: 8px; }
.title-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--primitive-gradient-app-tile); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.title-icon img { position: absolute; inset: 0; width: 100%; height: 100%; }
.page-title { margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; }                              /* Header 5 */
.segmented { display: flex; isolation: isolate; }
.seg { min-width: 44px; min-height: 44px; width: 44px; background: var(--color-surface-secondary); border: 1px solid var(--primitive-color-neutral-300); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-button-default); padding: 8px; }
.seg:first-child { border-radius: 8px 0 0 8px; margin-right: -1px; }
.seg:last-child { border-radius: 0 8px 8px 0; }
.seg[aria-pressed="true"] { border-color: var(--color-button-default); z-index: 2; position: relative; }

/* Table card */
.card { background: var(--color-surface-secondary); border: 1px solid var(--primitive-color-neutral-100); border-radius: 16px; padding: 16px 0 0; overflow: hidden; }
.card-head { display: flex; flex-direction: column; gap: 12px; }
.head-inner { display: flex; flex-direction: column; gap: 13px; }

.title-with-tag { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
.sec-title { margin: 0; font-size: 20px; line-height: 24px; font-weight: 600; }                              /* Sub Header 1 */
.tag-grey { background: var(--primitive-color-semantic-bg-grey); color: var(--color-text-label); font-size: 12px; line-height: 20px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
.btn-primary-md { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 8px 12px; background: var(--color-button-default); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; line-height: 24px; cursor: pointer; }

.btn-secondary-icon { display: inline-flex; align-items: center; justify-content: center; height: 40px; width: 48px; background: var(--color-surface-secondary); color: var(--color-button-default); border: 1px solid var(--color-button-default); border-radius: 8px; cursor: pointer; }
.btn-secondary-icon:hover { background: var(--primitive-color-semantic-bg-blue); }
.tools-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; flex-wrap: wrap; }
.view-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 137px; height: 40px; padding: 12px 8px; background: var(--color-surface-secondary); border: 1px solid var(--primitive-color-neutral-300); border-radius: 4px; font-size: 14px; line-height: 20px; color: var(--color-text-label); cursor: pointer; }
.divider { height: 1px; background: var(--primitive-color-neutral-100); width: calc(100% - 68px); }   /* design line is 1502px of a 1570px table */

/* Table */
.table-scroll { overflow-x: auto; margin-top: 8px; }
table { width: 100%; min-width: 1100px; border-collapse: collapse; table-layout: fixed; }
thead th { height: 52px; padding: 16px; text-align: left; background: var(--color-surface-primary); border-bottom: 1px solid var(--primitive-color-neutral-200); font-size: 16px; line-height: 20px; font-weight: 600; color: var(--color-text-large-text); white-space: nowrap; }   /* Sub Header 2 */
thead th.sortable { cursor: pointer; user-select: none; }
.th-inner { display: inline-flex; align-items: center; gap: 12px; }
.th-inner svg { width: 16px; height: 16px; flex-shrink: 0; }
th[aria-sort="ascending"] .th-inner, th[aria-sort="descending"] .th-inner { color: var(--color-button-default); }
tbody td { height: 52px; padding: 16px; border-bottom: 1px solid var(--primitive-color-neutral-100); font-size: 14px; line-height: 20px; color: var(--color-text-primary); background: var(--color-surface-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  /* Body Small */
tbody tr:nth-child(even) td { background: var(--primitive-color-semantic-bg-grey); }
tbody tr.selected td { background: var(--primitive-color-semantic-bg-blue); border-bottom-color: var(--color-button-default); }

.asset { display: flex; align-items: center; gap: 12px; }
.asset .count { position: relative; width: 24px; height: 24px; flex-shrink: 0; }

.cb:indeterminate::after { content: ""; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; background: #fff; }

</style>

<script>
  // Asset names and link counts are from the Figma frame (5527:61169 column);
  // ID / name / type / level text comes from the earlier screenshot of this page.
  var DATA = [
    { id: "FFS.108", name: "Local External Corrosion", n: 3, asset: "E101 - Shell",           type: "Local Metal Loss",           level: "Level 2", status: "Completed" },
    { id: "FFS.107", name: "Corroded Nozzle",          n: 1, asset: "D103 - Nozzle A",        type: "Surface Oxidation",          level: "Level 1", status: "Completed" },
    { id: "FFS.106", name: "Pitted Tubes",             n: 1, asset: "E101 - Bundle",          type: "Pitting Corrosion",          level: "Level 2", status: "Completed", selected: true },
    { id: "FFS.105", name: "Corroded Head",            n: 1, asset: "D123 - Head",            type: "General Metal Loss",         level: "Level 1", status: "Completed" },
    { id: "FFS.104", name: "Crack Defect",             n: 1, asset: "D103 - Nozzle B",        type: "Crack-like Flaw",            level: "Level 2", status: "Completed" },
    { id: "FFS.103", name: "Piping Creep",             n: 3, asset: "D103 - Nozzle B",        type: "Creep Damage",               level: "Level 1", status: "Completed" },
    { id: "FFS.102", name: "Shell Dent",               n: 1, asset: "E102 - Shell",           type: "Dents/Gouges",               level: "Level 2", status: "Completed" },
    { id: "FFS.101", name: "Shell Plate Laminations",  n: 1, asset: "E102 - Shell - Bundle",  type: "Lamination",                 level: "Level 1", status: "Completed" },
    { id: "FFS.100", name: "Piping Fatigue Assessme...", n: 1, asset: "E103 - Pipe",          type: "Fatigue Damage",             level: "Level 2", status: "Completed" },
    { id: "FFS.99",  name: "Heat Exchanger Fouling",   n: 4, asset: "E104 - Connector",       type: "Wear and Tear",              level: "Level 1", status: "Completed" },
    { id: "FFS.98",  name: "Weld Integrity Issues",    n: 2, asset: "D104 - Valve",           type: "Stress Corrosion Cracking",  level: "Level 2", status: "Completed" }
  ];
  var view = DATA.slice(), sortKey = null, sortDir = 1;
  var tbody = document.getElementById('rows'), all = document.getElementById('all'), empty = document.getElementById('empty');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render() {
    tbody.innerHTML = view.map(function (r, i) {
      return '<tr class="' + (r.selected ? 'selected' : '') + '" data-i="' + DATA.indexOf(r) + '">' +
        '<td class="check"><input type="checkbox" class="cb row-cb" aria-label="Select ' + esc(r.id) + '"' + (r.selected ? ' checked' : '') + '></td>' +
        '<td>' + esc(r.id) + '</td>' +
        '<td title="' + esc(r.name) + '">' + esc(r.name) + '</td>' +
        '<td><div class="asset"><span class="count" aria-label="' + r.n + ' linked"><svg width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="#4353ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v13M2 12l3 3 3-3"/><path d="M9 4h3M9 7h3"/></svg><b>' + r.n + '</b></span><a href="#">' + esc(r.asset) + '</a></div></td>' +
        '<td>' + esc(r.type) + '</td>' +
        '<td>' + esc(r.level) + '</td>' +
        '<td><span class="tag-green">' + esc(r.status) + '</span></td>' +
        '<td class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></td>' +
        '</tr>';
    }).join('');
    empty.hidden = view.length > 0;
    syncAll();
  }

  function syncAll() {
    var sel = view.filter(function (r) { return r.selected; }).length;
    all.checked = view.length > 0 && sel === view.length;
    all.indeterminate = sel > 0 && sel < view.length;
  }

  tbody.addEventListener('change', function (e) {
    if (!e.target.classList.contains('row-cb')) return;
    var tr = e.target.closest('tr'), r = DATA[+tr.dataset.i];
    r.selected = e.target.checked; tr.classList.toggle('selected', r.selected); syncAll();
  });
  all.addEventListener('change', function () {
    view.forEach(function (r) { r.selected = all.checked; }); render();
  });

  document.getElementById('q').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    view = DATA.filter(function (r) { return !q || [r.id, r.name, r.asset, r.type, r.level, r.status].join(' ').toLowerCase().indexOf(q) > -1; });
    applySort(); render();
  });

  function applySort() {
    if (!sortKey) return;
    view.sort(function (a, b) {
      var x = String(a[sortKey]), y = String(b[sortKey]);
      return x.localeCompare(y, undefined, { numeric: true }) * sortDir;
    });
  }
  document.querySelectorAll('th.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.dataset.key;
      sortDir = (sortKey === k) ? -sortDir : 1; sortKey = k;
      document.querySelectorAll('th.sortable').forEach(function (o) { o.setAttribute('aria-sort', 'none'); });
      th.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
      applySort(); render();
    });
  });

  render();
</script>
